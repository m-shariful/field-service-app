services:
  redis:
    image: redis:8.4-alpine
    container_name: field-service-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - field_service_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  field_service_redis_data:
